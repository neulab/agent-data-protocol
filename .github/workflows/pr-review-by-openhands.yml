---
name: PR Review by OpenHands

on:
  # Use pull_request for same-repo PRs so workflow changes can self-verify in PRs.
  pull_request:
    types: [opened, ready_for_review, labeled, review_requested]
  # Use pull_request_target for fork PRs so maintainers can explicitly trigger
  # reviews without exposing repository secrets to untrusted fork workflow code.
  pull_request_target:
    types: [opened, ready_for_review, labeled, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    # Run on same-repo PRs via pull_request and on fork PRs via
    # pull_request_target. First-time/NONE contributors still require a
    # maintainer trigger through the review-this label or reviewer request.
    if: |
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        )
      ) &&
      (
        (github.event.action == 'opened' && github.event.pull_request.draft == false && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
        (github.event.action == 'ready_for_review' && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
        (github.event.action == 'labeled' && github.event.label.name == 'review-this') ||
        (
          github.event.action == 'review_requested' &&
          (
            github.event.requested_reviewer.login == 'openhands-agent' ||
            github.event.requested_reviewer.login == 'all-hands-bot'
          )
        )
      )
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    env:
      OPENHANDS_PR_REVIEW_DEBUG: '1'
      PYTHONPATH: ${{ github.workspace }}/.github/pr-review-debug
    steps:
      - name: Install PR review LLM debug hook
        shell: bash
        run: |
          mkdir -p .github/pr-review-debug
          cat > .github/pr-review-debug/sitecustomize.py <<'PY'
          import builtins
          import functools
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          if os.environ.get("OPENHANDS_PR_REVIEW_DEBUG") == "1":
              _SECRET_VALUES = [
                  value
                  for key, value in os.environ.items()
                  if any(token in key.upper() for token in ("TOKEN", "KEY", "SECRET"))
                  and value
              ]
              _SECRET_PATTERNS = [
                  re.compile(r"sk-[A-Za-z0-9_\-]{12,}"),
                  re.compile(r"sk-proj-[A-Za-z0-9_\-]{12,}"),
                  re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}"),
                  re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
                  re.compile(r"(?i)(authorization:\\s*bearer\\s+)[A-Za-z0-9._\\-]+"),
                  re.compile(r"(?i)(api[_-]?key['\"\\s:=]+)[A-Za-z0-9._\\-]+"),
              ]
              _INDICATORS = (
                  "github_token",
                  "authorization",
                  "bearer",
                  "secret",
                  "api key",
                  "token",
                  "curl",
                  "graphql",
                  "pull_request",
                  "review",
                  "tool",
                  "execute",
                  "bash",
                  "exfiltrat",
                  "malicious",
                  "ignore previous",
                  "disregard",
                  "system prompt",
              )

              def _redact(value):
                  text = str(value)
                  for secret in sorted(_SECRET_VALUES, key=len, reverse=True):
                      if len(secret) >= 4:
                          text = text.replace(secret, "<redacted-env-secret>")
                  for pattern in _SECRET_PATTERNS:
                      text = pattern.sub(lambda m: (m.group(1) if m.groups() else "") + "<redacted-pattern-secret>", text)
                  return text

              def _content_to_text(content):
                  if content is None:
                      return ""
                  if isinstance(content, str):
                      return content
                  return json.dumps(content, sort_keys=True, default=str)

              def _message_summary(message):
                  if not isinstance(message, dict):
                      text = _content_to_text(message)
                      role = type(message).__name__
                  else:
                      role = str(message.get("role", "<missing>"))
                      text = _content_to_text(message.get("content"))
                  lower = text.lower()
                  redacted = _redact(text)
                  return {
                      "role": role,
                      "chars": len(text),
                      "sha256": hashlib.sha256(text.encode("utf-8", errors="replace")).hexdigest(),
                      "indicator_counts": {indicator: lower.count(indicator) for indicator in _INDICATORS if lower.count(indicator)},
                      "contains_redacted_env_secret": any(secret and secret in text for secret in _SECRET_VALUES),
                      "first_700": redacted[:700],
                      "last_700": redacted[-700:] if len(redacted) > 700 else redacted,
                  }

              def _exception_chain(exc):
                  chain = []
                  current = exc
                  seen = set()
                  while current is not None and id(current) not in seen and len(chain) < 8:
                      seen.add(id(current))
                      chain.append({"type": type(current).__name__, "message_first_1200": _redact(repr(current))[:1200]})
                      current = getattr(current, "__cause__", None) or getattr(current, "__context__", None)
                  return chain

              def _write_debug(record):
                  line = json.dumps(record, sort_keys=True, default=str)
                  destinations = [
                      Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "openhands-pr-review-llm-debug.jsonl",
                      Path.cwd() / "pr-review-llm-debug.log",
                  ]
                  for destination in destinations:
                      try:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with destination.open("a", encoding="utf-8") as handle:
                              handle.write(line + "\n")
                      except Exception:
                          pass
                  print("::notice title=OpenHands PR review LLM debug::" + _redact(line[:1800]), file=sys.stderr)

              def _patch_openhands_llm_module(module):
                  cls = getattr(module, "LLM", None)
                  if cls is None or getattr(cls, "_pr_review_debug_patched", False):
                      return
                  original = cls._transport_call

                  @functools.wraps(original)
                  def _debug_transport(self, *args, **kwargs):
                      start = time.time()
                      messages = kwargs.get("messages")
                      if messages is None and args and isinstance(args[0], list):
                          messages = args[0]
                      if messages is None:
                          messages = []
                      tools = kwargs.get("tools") or []
                      record = {
                          "phase": "before_openhands_llm_transport",
                          "model": _redact(getattr(self, "model", "")),
                          "base_url": _redact(getattr(self, "base_url", "")),
                          "message_count": len(messages) if isinstance(messages, list) else 1,
                          "total_message_chars": sum(len(_content_to_text(m.get("content") if isinstance(m, dict) else m)) for m in messages) if isinstance(messages, list) else len(_content_to_text(messages)),
                          "messages": [_message_summary(m) for m in messages[:30]] if isinstance(messages, list) else [_message_summary(messages)],
                          "truncated_message_summaries": max(0, len(messages) - 30) if isinstance(messages, list) else 0,
                          "tools_count": len(tools) if isinstance(tools, list) else 0,
                          "tool_names": [tool.get("function", {}).get("name") or tool.get("name") for tool in tools[:50] if isinstance(tool, dict)] if isinstance(tools, list) else [],
                          "safe_kwarg_keys": sorted(k for k in kwargs if k not in {"api_key", "headers", "extra_headers"}),
                      }
                      _write_debug(record)
                      try:
                          response = original(self, *args, **kwargs)
                      except Exception as exc:
                          failure = dict(record)
                          failure.update(
                              {
                                  "phase": "openhands_llm_transport_exception",
                                  "elapsed_seconds": round(time.time() - start, 3),
                                  "exception_type": type(exc).__name__,
                                  "exception_message_first_5000": _redact(repr(exc))[:5000],
                                  "exception_chain": _exception_chain(exc),
                              }
                          )
                          _write_debug(failure)
                          raise
                      _write_debug(
                          {
                              "phase": "openhands_llm_transport_success",
                              "elapsed_seconds": round(time.time() - start, 3),
                              "model": record["model"],
                          }
                      )
                      return response

                  cls._transport_call = _debug_transport
                  cls._pr_review_debug_patched = True
                  _write_debug({"phase": "sitecustomize_openhands_llm_transport_hook_installed"})

              def _try_patch_openhands_llm():
                  module = sys.modules.get("openhands.sdk.llm.llm")
                  if module is not None:
                      try:
                          _patch_openhands_llm_module(module)
                      except Exception as exc:
                          _write_debug({"phase": "sitecustomize_openhands_patch_failed", "exception": _redact(repr(exc))})

              _original_import = builtins.__import__

              @functools.wraps(_original_import)
              def _debug_import(name, globals=None, locals=None, fromlist=(), level=0):
                  module = _original_import(name, globals, locals, fromlist, level)
                  if name == "openhands.sdk.llm.llm" or name.startswith("openhands.sdk"):
                      _try_patch_openhands_llm()
                  return module

              builtins.__import__ = _debug_import
              _try_patch_openhands_llm()
              _write_debug({"phase": "sitecustomize_openhands_import_hook_installed"})
          PY

      - name: Run PR Review
        uses: OpenHands/extensions/plugins/pr-review@main
        with:
          llm-model: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || 'litellm_proxy/claude-sonnet-4-5-20250929' }}
          llm-base-url: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL || 'https://llm-proxy.app.all-hands.dev' }}
          use-sub-agents: 'false'
          require-evidence: 'true'
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ github.token }}
          lmnr-api-key: ${{ secrets.LMNR_PROJECT_API_KEY }}

      - name: Show PR review LLM debug log
        if: always()
        shell: bash
        run: |
          echo '=== PR review LLM debug log from pr-repo ==='
          if [ -f pr-repo/pr-review-llm-debug.log ]; then
            sed -E 's/(sk-[A-Za-z0-9_-]{12,}|sk-proj-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/<redacted-pattern-secret>/g' pr-repo/pr-review-llm-debug.log
          else
            echo 'No pr-repo/pr-review-llm-debug.log found'
          fi
          echo '=== PR review LLM debug log from RUNNER_TEMP ==='
          if [ -n "${RUNNER_TEMP:-}" ] && [ -f "$RUNNER_TEMP/openhands-pr-review-llm-debug.jsonl" ]; then
            sed -E 's/(sk-[A-Za-z0-9_-]{12,}|sk-proj-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/<redacted-pattern-secret>/g' "$RUNNER_TEMP/openhands-pr-review-llm-debug.jsonl"
          else
            echo 'No RUNNER_TEMP debug log found'
          fi

      - name: Upload PR review LLM debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-llm-debug-${{ github.event.pull_request.number }}
          path: |
            pr-repo/pr-review-llm-debug.log
            ${{ runner.temp }}/openhands-pr-review-llm-debug.jsonl
          retention-days: 7
          if-no-files-found: ignore
